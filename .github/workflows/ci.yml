name: CI

# Линт, проверка типов и сборка Next.js. Зависимостей на приватные
# репозитории нет, поэтому токены не нужны.

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Установка зависимостей
        run: npm ci --no-audit --fund=false

      - name: Линт
        run: npm run lint

      - name: Типы
        run: npm run typecheck

      # Чистая логика режима пакета (FU_0006): SRI, разбор integrity, сборка
      # документа песочницы. Без тест-раннера — обычный assert из node.
      - name: Проверки пакета игры
        run: npm run check:package

      # Чистые модули: разбор X-Trace-ID, подпись автора, SRI пакета, итог
      # сессии. Раннер — сам Node (`node --test`), новых пакетов нет.
      - name: Тесты чистых модулей
        run: npm test

      - name: Сборка
        run: npm run build
